<style>

  main{padding:16px 16px 96px}

<script type="module">
/* =====================================================================
 * 우리집 관리비 — 단일 HTML 버전
 * 구조:  [설정/상수] → [유틸] → [저장소(Repository)] → [AI 분석] →
 *        [분석 로직] → [화면(View)] → [라우터]
 * 서버로 옮길 때는 createLocalRepo()와 같은 메서드를 가진 createApiRepo()를
 * 만들어 `repo`만 바꿔 끼우면 된다. 화면 코드는 repo 메서드만 사용한다.
 * ===================================================================== */

/* ---------- 1. 설정 / 상수 ---------- */
const SDK_URL = 'https://esm.sh/@anthropic-ai/sdk@1.3.0';
const DEFAULT_HOUSEHOLD = { aptName:'동탄역 포레너스', pyeong:33, area:84, members:4, heating:'중앙난방', billFormat:'아파트 앱 캡처 화면' };
const MODELS = [
  { id:'claude-opus-5-5',   label:'Claude Opus 5.5 (권장·가장 정확)' },
  { id:'claude-sonnet-5-5', label:'Claude Sonnet 5.5 (빠르고 저렴)' },
  { id:'claude-haiku-5-5',  label:'Claude Haiku 5.5 (가장 저렴)' },
];
// 표준 항목명: 달마다 고지서 표기가 조금 달라도 같은 이름으로 모아 비교하기 위함
const STANDARD_ITEMS = [
  '일반관리비','청소비','경비비','소독비','승강기유지비','지능형홈네트워크설비유지비','수선유지비',
  '장기수선충당금','위탁관리수수료','화재보험료','입주자대표회의운영비','선거관리위원회운영비',
  '공동전기료','승강기전기료','공동수도료','세대전기료','세대수도료','난방비','급탕비','가스료',
  'TV수신료','생활폐기물수수료','음식물처리비','커뮤니티시설이용료','주차비','잡수입공제'
];

/* ---------- 2. 유틸 ---------- */
const $ = (s, el = document) => el.querySelector(s);
const $$ = (s, el = document) => [...el.querySelectorAll(s)];
const num = n => Math.round(n).toLocaleString('ko-KR');
const won = n => (n == null || isNaN(n)) ? '-' : num(n) + '원';
const signedWon = n => (n > 0 ? '+' : n < 0 ? '−' : '') + num(Math.abs(n)) + '원';
const pctStr = p => (p == null || !isFinite(p)) ? '-' : (p > 0 ? '+' : p < 0 ? '−' : '') + Math.abs(p).toFixed(1) + '%';
const arrow = d => d > 0 ? '▲' : d < 0 ? '▼' : '─';
const dirCls = d => d > 0 ? 'up' : d < 0 ? 'down' : '';
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c]));
const ymAdd = (ym, d) => { let [y, m] = ym.split('-').map(Number); m += d; while (m < 1) { m += 12; y--; } while (m > 12) { m -= 12; y++; } return `${y}-${String(m).padStart(2,'0')}`; };
const ymLabel = ym => { const [y, m] = ym.split('-'); return `${y}년 ${+m}월`; };
const ymShort = ym => { const [y, m] = ym.split('-'); return `${y.slice(2)}.${m}`; };
const monthOf = ym => +ym.split('-')[1];
const isYm = s => /^\d{4}-(0[1-9]|1[0-2])$/.test(s || '');
const sumItems = items => items.reduce((s, i) => s + (Number(i.amount) || 0), 0);
const manWon = n => { const a = Math.abs(n); return a >= 10000 ? `${(a / 10000).toFixed(1).replace(/\.0$/, '')}만 원` : `${num(a)}원`; };
const parseAmount = s => { const t = String(s ?? '').replace(/[^\d\-]/g, ''); if (!t || t === '-') return 0; return parseInt(t, 10) || 0; };
const parseNum = s => { if (s === '' || s == null) return null; const v = parseFloat(String(s).replace(/,/g, '')); return isNaN(v) ? null : v; };
const nowYm = () => { const d = new Date(); return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2,'0')}`; };
function toast(msg, ms = 2600) { const t = document.createElement('div'); t.className = 'toast'; t.textContent = msg; document.body.appendChild(t); setTimeout(() => t.remove(), ms); }

/* ---------- 3. 저장소 (IndexedDB) ----------
 * 데이터 구조
 *  bills  : { id:'2026-10', yearMonth:'2026-10', items:[{name, rawLabel, amount, usage, unit}],
 *             total, billedTotal, memo, source:'ai'|'manual'|'sample', imageCount,
 *             createdAt, updatedAt, schemaVersion:1 }
 *  images : { billId:'2026-10', images:['data:image/jpeg;base64,...', ...] }
 *  kv     : 'settings' → { apiKey, proxyUrl, model, household:{...} }
 */
function createLocalRepo() {
  let dbp;
  const open = () => dbp ??= new Promise((res, rej) => {
    const r = indexedDB.open('apt-bill-db', 1);
    r.onupgradeneeded = () => {
      const db = r.result;
      db.createObjectStore('bills', { keyPath: 'id' });
      db.createObjectStore('images', { keyPath: 'billId' });
      db.createObjectStore('kv');
    };
    r.onsuccess = () => res(r.result);
    r.onerror = () => rej(r.error);
  });
  const tx = async (store, mode, fn) => {
    const db = await open();
    return new Promise((res, rej) => {
      const t = db.transaction(store, mode);
      const req = fn(t.objectStore(store));
      t.oncomplete = () => res(req?.result);
      t.onerror = () => rej(t.error);
      t.onabort = () => rej(t.error);
    });
  };
  return {
    async listBills() { return ((await tx('bills', 'readonly', s => s.getAll())) || []).sort((a, b) => a.yearMonth.localeCompare(b.yearMonth)); },
    getBill: id => tx('bills', 'readonly', s => s.get(id)),
    putBill: bill => tx('bills', 'readwrite', s => s.put(bill)),
    async deleteBill(id) { await tx('bills', 'readwrite', s => s.delete(id)); await tx('images', 'readwrite', s => s.delete(id)); },
    async getImages(id) { return (await tx('images', 'readonly', s => s.get(id)))?.images ?? []; },
    putImages: (id, images) => tx('images', 'readwrite', s => s.put({ billId: id, images })),
    async getSettings() { return { model: MODELS[0].id, apiKey: '', proxyUrl: '', household: { ...DEFAULT_HOUSEHOLD }, ...(await tx('kv', 'readonly', s => s.get('settings')) || {}) }; },
    saveSettings: v => tx('kv', 'readwrite', s => s.put(v, 'settings')),
    kind: 'local',
    async clearAll() { await tx('bills', 'readwrite', s => s.clear()); await tx('images', 'readwrite', s => s.clear()); },
  };
}
/* 서버 저장소 (Cloudflare Worker + D1 + KV, proxy/worker.js)
 * 프록시 주소 + 접속 암호가 설정되어 있고 웹 주소(https)로 열었을 때 사용한다.
 * 같은 메서드를 가지므로 화면 코드는 어느 저장소인지 몰라도 된다. */
function createApiRepo(base, pass) {
  const root = base.replace(/\/$/, '');
  const call = async (p, opt = {}) => {
    let r;
    try { r = await fetch(root + p, { method: opt.method || 'GET', body: opt.body, headers: { 'x-api-key': pass, ...(opt.body ? { 'Content-Type': 'application/json' } : {}) } }); }
    catch { throw new Error('서버에 연결하지 못했어요. 인터넷 연결과 프록시 주소를 확인해 주세요.'); }
    if (r.status === 401) throw new Error('서버 접속 암호가 맞지 않아요. 설정의 API 키 칸(접속 암호)을 확인해 주세요.');
    if (r.status === 403) throw new Error('이 주소에서는 서버를 쓸 수 없어요. https://sunguphong.github.io/apt-bill/ 에서 열어 주세요.');
    if (r.status === 404 && opt.allow404) return null;
    if (!r.ok) throw new Error(`서버 오류 (${r.status})`);
    return r.json();
  };
  const put = (p, body) => call(p, { method: 'PUT', body: JSON.stringify(body) });
  const enc = encodeURIComponent;
  return {
    kind: 'server',
    async listBills() { return (await call('/api/bills')).sort((a, b) => a.yearMonth.localeCompare(b.yearMonth)); },
    getBill: id => call('/api/bills/' + enc(id), { allow404: true }),
    putBill: b => put('/api/bills/' + enc(b.id), b),
    deleteBill: id => call('/api/bills/' + enc(id), { method: 'DELETE' }),
    getImages: id => call('/api/images/' + enc(id)),
    putImages: (id, images) => put('/api/images/' + enc(id), images),
    clearAll: () => call('/api/bills', { method: 'DELETE' }),
  };
}

function kindOf(name) {
  const n = name.replace(/\s/g, '');
  if (/공동|공용|승강기전기|가로등/.test(n) && /전기|수도/.test(n)) return 'common-util';
  if (/급탕|온수/.test(n)) return 'hotwater';
  if (/난방/.test(n)) return 'heat';
  if (/전기/.test(n)) return 'elec';
  if (/수도|상수|하수/.test(n)) return 'water';
  if (/가스/.test(n)) return 'gas';
  if (/장기수선/.test(n)) return 'ltr';
  if (/수선유지/.test(n)) return 'repair';
  if (/승강기/.test(n)) return 'elevator';
  if (/일반관리|경비|청소|소독|위탁/.test(n)) return 'labor';
  if (/보험/.test(n)) return 'insurance';
  if (/공제|할인|차감|잡수입/.test(n)) return 'credit';
  if (/TV|수신료/i.test(n)) return 'tv';
  return 'etc';
}

const isHeatStart = m => [10, 11, 12].includes(m);

/* ---------- 5. 분석 로직 ---------- */
function aggregate(items) {
  const m = new Map();
  for (const it of items || []) {
    const name = (it.name || '').trim() || '(이름없음)';
    const e = m.get(name) || { name, amount: 0, usage: null, unit: it.unit || '' };
    e.amount += Number(it.amount) || 0;
    if (it.usage != null && it.usage !== '') e.usage = (e.usage || 0) + Number(it.usage);
    if (!e.unit && it.unit) e.unit = it.unit;
    m.set(name, e);
  }
  return m;
}

function compare(cur, prev) {
  const a = aggregate(cur?.items), b = aggregate(prev?.items);
  const names = new Set([...a.keys(), ...b.keys()]);
  const rows = [...names].map(name => {
    const c = a.get(name), p = b.get(name);
    const curAmt = c ? c.amount : null, prevAmt = p ? p.amount : null;
    const diff = (curAmt || 0) - (prevAmt || 0);
    const pct = prevAmt ? diff / Math.abs(prevAmt) * 100 : null;
    const curUsage = c?.usage ?? null, prevUsage = p?.usage ?? null;
    const usagePct = (curUsage != null && prevUsage) ? (curUsage - prevUsage) / prevUsage * 100 : null;
    let unitPct = null;
    if (curUsage > 0 && prevUsage > 0 && curAmt > 0 && prevAmt > 0) unitPct = ((curAmt / curUsage) / (prevAmt / prevUsage) - 1) * 100;
    let status = '';
    if (prev) { if (!c || curAmt === 0 && prevAmt) status = 'removed'; else if (!p || (!prevAmt && curAmt)) status = 'new'; }
    return { name, cur: curAmt, prev: prevAmt, diff, pct, curUsage, prevUsage, usagePct, unitPct, unit: c?.unit || p?.unit || '', status };
  });
  rows.sort((x, y) => (y.cur ?? -1e12) - (x.cur ?? -1e12));
  const total = cur ? sumItems(cur.items) : 0, prevTotal = prev ? sumItems(prev.items) : null;
  const totalDiff = prev ? total - prevTotal : null;
  const totalPct = prev && prevTotal ? totalDiff / prevTotal * 100 : null;
  return { rows, total, prevTotal, totalDiff, totalPct };
}

function detectAnomalies(cmp, ym) {
  if (cmp.prevTotal == null) return [];
  const out = [];
  for (const r of cmp.rows) {
    let type = null;
    if (r.status === 'new') type = 'new';
    else if (r.status === 'removed') type = 'removed';
    else if (r.unitPct != null && r.unitPct >= 10 && Math.abs(r.usagePct) <= 10) type = 'unit';
    else if (r.pct != null && Math.abs(r.pct) >= 20 && Math.abs(r.diff) >= 500) type = 'swing';
    if (type) out.push({ type, row: r, why: explain(r, type, ym) });
  }
  const order = { unit: 0, swing: 1, new: 2, removed: 3 };
  return out.sort((x, y) => order[x.type] - order[y.type] || Math.abs(y.row.diff) - Math.abs(x.row.diff));
}

function summaryLine(cmp, ym) {
  const L = ymLabel(ym);
  if (cmp.prevTotal == null) return `${L} 관리비는 ${won(cmp.total)}이에요. 지난달 기록이 쌓이면 비교 분석을 보여드릴게요.`;
  const d = cmp.totalDiff;
  if (Math.abs(d) < 1000) return `지난달과 거의 같은 수준이에요 (${signedWon(d)}).`;
  const same = cmp.rows.filter(r => Math.sign(r.diff) === Math.sign(d)).sort((a, b) => Math.abs(b.diff) - Math.abs(a.diff));
  const top = same[0];
  const dir = d > 0 ? '증가' : '감소';
  if (!top) return `지난달보다 ${manWon(d)} ${dir}했어요.`;
  const share = Math.abs(top.diff) / Math.abs(d);
  const lead = share >= 0.5 ? `${top.name} 영향으로` : `${top.name} 등 여러 항목 영향으로`;
  return `${lead} 지난달보다 ${manWon(d)} ${dir}했어요.`;
}

function top3(bill) {
  const rows = [...aggregate(bill.items).values()].filter(r => r.amount > 0).sort((a, b) => b.amount - a.amount);
  const pos = rows.reduce((s, r) => s + r.amount, 0) || 1;
  return rows.slice(0, 3).map(r => ({ ...r, share: r.amount / pos * 100 }));
}

function lastN(n, endYm) {
  const end = endYm || latestBill()?.yearMonth || nowYm();
  return Array.from({ length: n }, (_, i) => ymAdd(end, i - n + 1));
}

function itemSeries(name, months) {
  return months.map(ym => { const b = billByYm(ym); if (!b) return { amt: null, usage: null }; const e = aggregate(b.items).get(name); return { amt: e ? e.amount : 0, usage: e?.usage ?? null, unit: e?.unit }; });
}

function tipsFor(bill, cmp) {
  const m = monthOf(bill.yearMonth);
  const agg = [...aggregate(bill.items).values()];
  const byKind = {};
  for (const r of agg) { const k = kindOf(r.name); if (USAGE_KINDS.includes(k)) { byKind[k] ??= { amount: 0, usage: null, unit: r.unit, names: [] }; byKind[k].amount += r.amount; if (r.usage != null) byKind[k].usage = (byKind[k].usage || 0) + r.usage; byKind[k].names.push(r.name); } }
  const kinds = Object.entries(byKind).filter(([, v]) => v.amount > 0).sort((a, b) => b[1].amount - a[1].amount);
  return kinds.slice(0, 3).map(([k, v]) => {
    const t = TIPS[k]; const notes = [];
    const rowDiff = cmp.rows.filter(r => kindOf(r.name) === k).reduce((s, r) => s + r.diff, 0);
    if (cmp.prevTotal != null && rowDiff) notes.push(`지난달보다 ${rowDiff > 0 ? '+' : '−'}${num(Math.abs(rowDiff))}원`);
    if (k === 'elec' && v.usage) {
      const [t1, t2] = isSummer(m) ? [300, 450] : [200, 400];
      const tier = v.usage <= t1 ? 1 : v.usage <= t2 ? 2 : 3;
      const next = tier === 1 ? t1 : tier === 2 ? t2 : null;
      notes.push(`이번 달 ${num(v.usage)}kWh → 주택용 누진 ${tier}구간${next ? ` (${next}kWh 초과 시 다음 구간)` : ' (최고 구간)'}`);
    }
    // 내 평균 대비
    const hist = state.bills.filter(b => b.yearMonth < bill.yearMonth).slice(-12).map(b => sumItems(b.items.filter(i => kindOf(i.name) === k))).filter(x => x > 0);
    if (hist.length >= 3) { const avg = hist.reduce((s, x) => s + x, 0) / hist.length; const p = (v.amount - avg) / avg * 100; notes.push(`최근 평균 대비 ${pctStr(p)}`); }
    let items = t.items;
    if (k === 'heat' && !(isWinter(m) || isHeatStart(m) || isHeatEnd(m))) items = items.slice(0, 2);
    return { kind: k, title: t.title, amount: v.amount, notes, items: items.slice(0, 3) };
  });
}

/* ---------- 6. 이미지 처리 ---------- */
function loadImage(src) { return new Promise((res, rej) => { const i = new Image(); i.onload = () => res(i); i.onerror = rej; i.src = src; }); }
async function fileToJpeg(file, maxW = 1200) {
  const url = URL.createObjectURL(file);
  try {
    const img = await loadImage(url);
    const scale = Math.min(1, maxW / img.width);
    const c = document.createElement('canvas');
    c.width = Math.round(img.width * scale); c.height = Math.round(img.height * scale);
    const g = c.getContext('2d'); g.fillStyle = '#fff'; g.fillRect(0, 0, c.width, c.height);
    g.drawImage(img, 0, 0, c.width, c.height);
    return c.toDataURL('image/jpeg', 0.88);
  } finally { URL.revokeObjectURL(url); }
}
// 긴 앱 캡처는 그대로 보내면 서버에서 축소되어 글씨가 뭉개지므로 세로로 잘라 보낸다.
async function tilesFor(dataUrl, tileH = 1500, overlap = 80) {
  const img = await loadImage(dataUrl);
  if (img.height <= tileH + 200) return [dataUrl.split(',')[1]];
  const out = [];
  for (let y = 0; y < img.height; y += tileH - overlap) {
    const h = Math.min(tileH, img.height - y);
    const c = document.createElement('canvas'); c.width = img.width; c.height = h;
    c.getContext('2d').drawImage(img, 0, y, img.width, h, 0, 0, img.width, h);
    out.push(c.toDataURL('image/jpeg', 0.9).split(',')[1]);
    if (y + h >= img.height) break;
  }
  return out;
}

function systemPrompt(h) {
  return `당신은 한국 아파트 관리비 고지서를 정확하게 읽어 구조화하는 전문가입니다.
세대 정보: ${h.aptName}, ${h.pyeong}평(전용 ${h.area}㎡), ${h.members}인 가족, ${h.heating}. 고지서 형태: ${h.billFormat}.

규칙:
- items에는 '당월' 부과 금액만 넣으세요. 전월 금액·증감 열, 소계(공용관리비 계, 개별사용료 계), 총합계, 미납액, 연체료는 넣지 마세요.
- 같은 항목이 겹쳐 보이는 부분 이미지(연속 캡처, 겹침 영역 있음)가 여러 장일 수 있습니다. 중복 계산하지 마세요.
- name은 아래 표준 항목명 중 의미가 같은 것을 고르고, 없으면 고지서 표기를 그대로 쓰세요.
  표준 항목명: ${STANDARD_ITEMS.join(', ')}
  (예: '전기료'·'세대전기' → 세대전기료, '수도료'·'세대수도' → 세대수도료, '공동전기'·'공용전기' → 공동전기료, '난방비(기본)'+'난방비(사용)'은 각각 따로 두되 이름은 '난방비(기본)', '난방비')
- 할인·공제(잡수입 차감, 에너지 절약 할인 등)는 음수 금액입니다.
- 전기·수도·난방·급탕·가스의 '당월 사용량'(지침값이 아닌 사용량)이 보이면 해당 금액 항목의 usage/unit에 넣으세요. 없으면 null.
- year_month: 고지서의 '○년 ○월분' 표기를 우선 사용하세요. 납기일만 보이면 보통 납기월의 전월이 부과 대상 월입니다. 연도가 없으면 오늘(${new Date().toISOString().slice(0, 10)}) 기준 가장 최근 과거로 판단하세요.
- 금액은 콤마 없는 정수(원)로. 확실하지 않은 숫자가 있으면 notes에 적으세요.`;
}

async function analyzeBill(images, settings) {
  if (!settings.apiKey && !settings.proxyUrl) throw new Error('설정에서 Claude API 키(또는 프록시 주소)를 먼저 입력해 주세요.');
  const { default: Anthropic } = await import(SDK_URL);
  const client = settings.proxyUrl
    ? new Anthropic({ baseURL: settings.proxyUrl.replace(/\/$/, ''), apiKey: settings.apiKey || 'via-proxy', dangerouslyAllowBrowser: true }) // 프록시 사용 시 API 키 칸 = 프록시 접속 암호
    : new Anthropic({ apiKey: settings.apiKey, dangerouslyAllowBrowser: true });

  const content = [];
  let idx = 1;
  for (const d of images) for (const b64 of await tilesFor(d)) {
    content.push({ type: 'text', text: `이미지 ${idx++}` });
    content.push({ type: 'image', source: { type: 'base64', media_type: 'image/jpeg', data: b64 } });
  }
  content.push({ type: 'text', text: '위 관리비 고지서에서 부과 연월, 항목별 당월 금액과 사용량, 고지서 합계를 추출해 주세요.' });

  const model = settings.model || MODELS[0].id;
  const params = {
    model, max_tokens: 16000,
    system: systemPrompt(settings.household || DEFAULT_HOUSEHOLD),
    output_config: { effort: 'medium', format: { type: 'json_schema', schema: BILL_SCHEMA } },
    messages: [{ role: 'user', content }],
  };
  // 안전 분류기가 드물게 거절할 때 다른 모델로 자동 재시도 (Opus/Sonnet 5.5 + Claude API에서만 지원)
  if (model !== 'claude-haiku-5-5') { params.betas = ['server-side-fallback-2026-07-01']; params.fallbacks = 'default'; }

  let res;
  try {
    res = await client.beta.messages.stream(params).finalMessage();
  } catch (e) {
    if (e instanceof Anthropic.AuthenticationError) throw new Error('API 키가 올바르지 않아요. 설정을 확인해 주세요.');
    if (e instanceof Anthropic.RateLimitError) throw new Error('요청이 너무 많아요. 잠시 후 다시 시도해 주세요.');
    if (e instanceof Anthropic.APIConnectionError) throw new Error('네트워크 연결에 실패했어요. (프록시 주소/인터넷 확인)');
    if (e instanceof Anthropic.APIError) throw new Error(`Claude API 오류 (${e.status ?? ''}): ${e.message}`);
    throw e;
  }
  if (res.stop_reason === 'refusal') throw new Error('AI가 이 이미지를 분석하지 못했어요. 다른 캡처로 시도하거나 직접 입력해 주세요.');
  if (res.stop_reason === 'max_tokens') throw new Error('응답이 너무 길어 잘렸어요. 이미지를 나눠서 다시 시도해 주세요.');
  const text = res.content.filter(b => b.type === 'text').map(b => b.text).join('');
  let data;
  try { data = JSON.parse(text); } catch { throw new Error('AI 응답을 해석하지 못했어요. 다시 시도해 주세요.'); }
  return data;
}

function anomHtml(a) {
  const r = a.row;
  const tag = { new: '<span class="pill new">신규</span>', removed: '<span class="pill gone">사라짐</span>', unit: '<span class="pill warn">단가 인상 의심</span>', swing: `<span class="pill ${dirCls(r.diff)}">${r.diff > 0 ? '급증' : '급감'}</span>` }[a.type];
  let detail = '';
  if (a.type === 'new') detail = `이번 달 ${won(r.cur)}`;
  else if (a.type === 'removed') detail = `지난달 ${won(r.prev)} → 이번 달 없음`;
  else if (a.type === 'unit') detail = `사용량 ${pctStr(r.usagePct)} · 요금 ${pctStr(r.pct)} · 단위당 요금 ${pctStr(r.unitPct)}`;
  else detail = `${won(r.prev)} → ${won(r.cur)} (${signedWon(r.diff)}, ${pctStr(r.pct)})`;
  const cls = a.type === 'unit' ? '' : (r.diff > 0 ? 'up' : r.diff < 0 ? 'down' : '');
  return `<div class="anom ${cls}"><div class="row"><span class="h">${esc(r.name)}</span>${tag}<span class="small muted num">${detail}</span></div><div class="why">→ ${esc(a.why)}</div></div>`;
}

function usageCell(u, unit) { return u == null ? '' : `<div class="muted small num">${Number(u).toLocaleString('ko-KR', { maximumFractionDigits: 2 })}${unit ? ' ' + esc(unit) : ''}</div>`; }
function compareTable(cmp, hasPrev) {
  const body = cmp.rows.map(r => `<tr>
    <td>${esc(r.name)} ${r.status === 'new' ? '<span class="pill new">신규</span>' : r.status === 'removed' ? '<span class="pill gone">없음</span>' : ''}</td>
    ${hasPrev ? `<td class="num">${r.prev == null ? '-' : won(r.prev)}${usageCell(r.prevUsage, r.unit)}</td>` : ''}
    <td class="num"><b>${r.cur == null ? '-' : won(r.cur)}</b>${usageCell(r.curUsage, r.unit)}</td>
    ${hasPrev ? `<td class="num ${dirCls(r.diff)}">${r.diff ? arrow(r.diff) + ' ' + num(Math.abs(r.diff)) : '─'}</td>
    <td class="num ${dirCls(r.diff)}">${r.pct == null ? (r.status ? '-' : '') : pctStr(r.pct)}</td>` : ''}
  </tr>`).join('');
  return `<table class="t"><thead><tr><th>항목</th>${hasPrev ? '<th>지난달</th>' : ''}<th>이번 달</th>${hasPrev ? '<th>증감(원)</th><th>증감률</th>' : ''}</tr></thead>
    <tbody>${body}<tr class="sumrow"><td>합계</td>${hasPrev ? `<td class="num">${won(cmp.prevTotal)}</td>` : ''}<td class="num">${won(cmp.total)}</td>
    ${hasPrev ? `<td class="num ${dirCls(cmp.totalDiff)}">${arrow(cmp.totalDiff)} ${num(Math.abs(cmp.totalDiff))}</td><td class="num ${dirCls(cmp.totalDiff)}">${pctStr(cmp.totalPct)}</td>` : ''}</tr></tbody></table>`;
}

      <button class="btn" id="btnAnalyze" ${state.pendingImages.length && hasKey ? '' : 'disabled'}>🤖 AI로 분석하기</button>
      <button class="btn ghost" id="btnManual">✍️ 직접 입력</button>
    </div>
  </div>`;
  const drawThumbs = () => {
    $('#thumbs').innerHTML = state.pendingImages.map((d, i) => `<div class="thumb"><img src="${d}" alt="고지서 ${i + 1}"><button data-i="${i}" aria-label="삭제">×</button></div>`).join('');
    $$('#thumbs button').forEach(b => b.onclick = () => { state.pendingImages.splice(+b.dataset.i, 1); renderUpload(); });
  };
  drawThumbs();
  const onFiles = async files => {
    for (const f of [...files].slice(0, 6 - state.pendingImages.length)) {
      try { state.pendingImages.push(await fileToJpeg(f)); } catch { toast('이미지를 읽지 못했어요: ' + f.name); }
    }
    renderUpload();
  };
  $('#fCam').onchange = e => onFiles(e.target.files);
  $('#fPick').onchange = e => onFiles(e.target.files);
  const drop = $('#drop');
  drop.ondragover = e => { e.preventDefault(); drop.style.borderColor = '#0F4F4A'; };
  drop.ondragleave = () => drop.style.borderColor = '';
  drop.ondrop = e => { e.preventDefault(); drop.style.borderColor = ''; onFiles(e.dataTransfer.files); };
  $('#btnManual').onclick = () => {
    const prev = latestBill();
    state.draft = { mode: 'new', yearMonth: prev ? ymAdd(prev.yearMonth, 1) : ymAdd(nowYm(), -1), ymEvidence: '',
      items: prev ? prev.items.map(i => ({ name: i.name, amount: 0, usage: null, unit: i.unit || '' })) : STANDARD_ITEMS.slice(0, 8).map(n => ({ name: n, amount: 0, usage: null, unit: '' })),
      images: state.pendingImages.slice(), billedTotal: null, memo: '', notes: prev ? '지난달 항목을 불러왔어요. 금액만 입력하세요.' : '', source: 'manual' };
    renderEditorPage();
  };
  $('#btnAnalyze').onclick = async () => {
    $('#btnAnalyze').disabled = true; $('#btnManual').disabled = true;
    $('#status').innerHTML = `<div style="text-align:center;padding:24px"><div class="spinner"></div><b>AI가 고지서를 읽고 있어요…</b><div class="muted small">보통 20초~1분 정도 걸려요.</div></div>`;
    try {
      const r = await analyzeBill(state.pendingImages, state.settings);
      state.draft = {
        mode: 'new', yearMonth: isYm(r.year_month) ? r.year_month : ymAdd(nowYm(), -1), ymEvidence: r.year_month_evidence || '', ymAuto: isYm(r.year_month),
        items: (r.items || []).map(i => ({ name: i.name, rawLabel: i.raw_label, amount: i.amount, usage: i.usage, unit: i.unit || '' })),
        images: state.pendingImages.slice(), billedTotal: r.billed_total, memo: '', notes: r.notes || '', source: 'ai',
      };
      renderEditorPage();
    } catch (e) {
      $('#status').innerHTML = `<div class="notice err">${esc(e.message || e)}</div>`;
      $('#btnAnalyze').disabled = false; $('#btnManual').disabled = false;
    }
  };
}

/* --- 8-3. 분석 결과 확인 · 수정 (신규 등록 / 기존 기록 수정 공용) --- */
function renderEditorPage() {
  const d = state.draft;
  const isEdit = d.mode === 'edit';
  view.innerHTML = `
  <div class="card">
    <div class="row between"><h2 style="margin:0">${isEdit ? '기록 수정' : (d.source === 'ai' ? 'AI 분석 결과 확인' : '직접 입력')}</h2>
      <button class="btn ghost sm" id="btnCancel">취소</button></div>
    <label class="lbl" for="ym">부과 연월</label>
    <div class="row"><input class="f" type="month" id="ym" value="${d.yearMonth}" style="max-width:200px">
      ${d.ymAuto ? `<span class="pill gray">자동 인식${d.ymEvidence ? ': “' + esc(d.ymEvidence) + '”' : ''}</span>` : ''}</div>
    <div id="ymWarn"></div>
    ${d.notes ? `<div class="notice">${esc(d.notes)}</div>` : ''}
    <p class="muted small" style="margin:12px 0 6px">잘못 읽힌 금액은 바로 고칠 수 있어요. 공제·할인은 음수(-)로 입력하세요.</p>
    <div class="tscroll"><table class="t ed"><thead><tr><th>항목</th><th>금액(원)</th><th>사용량</th><th>단위</th><th></th></tr></thead>
      <tbody id="edRows"></tbody></table></div>
    <button class="btn ghost sm" id="btnAdd" style="margin-top:8px">＋ 항목 추가</button>
    <div class="card" style="background:#F7F8FB;box-shadow:none;margin:14px 0 0">
      <div class="row between"><span>항목 합계</span><b class="num" id="edSum"></b></div>
      ${d.billedTotal != null ? `<div class="row between small muted"><span>고지서 표기 합계</span><span class="num">${won(d.billedTotal)}</span></div>` : ''}
      <div id="sumCheck"></div>
    </div>
    <label class="lbl" for="memo">메모</label>
    <textarea class="f" id="memo" rows="2" placeholder="예: 이번 달부터 난방 시작">${esc(d.memo || '')}</textarea>
    ${d.images?.length ? `<details style="margin-top:12px"><summary class="muted small">원본 이미지 보기 (${d.images.length}장)</summary><div class="origimgs" style="margin-top:8px">${d.images.map(s => `<img src="${s}" alt="고지서">`).join('')}</div></details>` : ''}
    <button class="btn block" id="btnSave" style="margin-top:16px">✔ 확인하고 저장</button>
  </div>`;

  const drawRows = () => {
    $('#edRows').innerHTML = d.items.map((it, i) => `<tr data-i="${i}">
      <td><input class="name" list="itemNames" value="${esc(it.name)}" data-k="name" ${it.rawLabel && it.rawLabel !== it.name ? `title="고지서 표기: ${esc(it.rawLabel)}"` : ''}></td>
      <td><input class="amt num" inputmode="numeric" value="${it.amount ? num(it.amount) : ''}" placeholder="0" data-k="amount"></td>
      <td><input class="usage num" inputmode="decimal" value="${it.usage ?? ''}" data-k="usage"></td>
      <td><input class="unit" value="${esc(it.unit || '')}" data-k="unit" placeholder="-"></td>
      <td><button class="x" data-del="${i}" aria-label="삭제">×</button></td></tr>`).join('');
    $$('#edRows input').forEach(inp => {
      inp.oninput = () => {
        const it = d.items[+inp.closest('tr').dataset.i], k = inp.dataset.k;
        it[k] = k === 'amount' ? parseAmount(inp.value) : k === 'usage' ? parseNum(inp.value) : inp.value;
        updSum();
      };
      if (inp.dataset.k === 'amount') inp.onblur = () => { const v = parseAmount(inp.value); inp.value = v ? num(v) : ''; };
    });
    $$('#edRows [data-del]').forEach(b => b.onclick = () => { d.items.splice(+b.dataset.del, 1); drawRows(); updSum(); });
  };
  const updSum = () => {
    const s = sumItems(d.items);
    $('#edSum').textContent = won(s);
    $('#sumCheck').innerHTML = d.billedTotal != null && s !== d.billedTotal
      ? `<div class="notice" style="margin-bottom:0">항목 합계가 고지서 합계와 <b>${num(Math.abs(s - d.billedTotal))}원</b> 차이 나요. 빠지거나 잘못 읽힌 항목이 없는지 확인해 주세요.</div>`
      : d.billedTotal != null ? `<div class="notice ok" style="margin-bottom:0">고지서 합계와 일치해요 ✓</div>` : '';
  };
  const checkYm = () => {
    const ym = $('#ym').value;
    const clash = billByYm(ym) && !(isEdit && ym === d.originalId);
    $('#ymWarn').innerHTML = clash ? `<div class="notice">${ymLabel(ym)} 기록이 이미 있어요. 저장하면 덮어씁니다.</div>` : '';
  };
  drawRows(); updSum(); checkYm();
  $('#ym').onchange = () => { d.yearMonth = $('#ym').value; checkYm(); };

  $('#btnAdd').onclick = () => { d.items.push({ name: '', amount: 0, usage: null, unit: '' }); drawRows(); $$('#edRows input.name').pop()?.focus(); };
  $('#btnCancel').onclick = () => { const back = isEdit ? `#/record/${d.originalId}` : '#/upload'; state.draft = null; if (!isEdit) state.pendingImages = []; location.hash = back; route(); };
  $('#btnSave').onclick = async () => {
    const ym = $('#ym').value;
    if (!isYm(ym)) { toast('부과 연월을 선택해 주세요.'); return; }
    const items = d.items.filter(i => (i.name || '').trim() && (Number(i.amount) || i.usage != null)).map(i => ({
      name: i.name.trim(), rawLabel: i.rawLabel || i.name.trim(), amount: Number(i.amount) || 0,
      usage: i.usage == null || i.usage === '' ? null : Number(i.usage), unit: (i.unit || '').trim() }));
    if (!items.length) { toast('항목을 하나 이상 입력해 주세요.'); return; }
    if (billByYm(ym) && !(isEdit && ym === d.originalId) && !confirm(`${ymLabel(ym)} 기록을 덮어쓸까요?`)) return;
    const old = isEdit ? billByYm(d.originalId) : null;
    const now = new Date().toISOString();
    const bill = { id: ym, yearMonth: ym, items, total: sumItems(items), billedTotal: d.billedTotal ?? null, memo: d.memo || '',
      source: old?.source === 'sample' ? 'sample' : (old?.source || d.source), imageCount: d.images?.length || 0,
      createdAt: old?.createdAt || now, updatedAt: now, schemaVersion: 1 };
    if (isEdit && d.originalId !== ym) await repo.deleteBill(d.originalId);
    await repo.putBill(bill);
    await repo.putImages(ym, d.images || []);
    state.draft = null; state.pendingImages = []; state.dashYm = ym;
    await reload(); toast(`${ymLabel(ym)} 관리비를 저장했어요.`);
    location.hash = '#/';
  };
}

/* --- 8-4. 월별 추이 --- */
function renderTrends() {
  if (!state.bills.length) { view.innerHTML = emptyState(); return; }
  const months = lastN(12);
  const totals = months.map(m => billByYm(m) ? sumItems(billByYm(m).items) : null);
  const valid = totals.filter(v => v != null);
  const avg = valid.reduce((s, v) => s + v, 0) / valid.length;
  // 항목 목록: 누적 금액 큰 순
  const sums = {};
  state.bills.forEach(b => aggregate(b.items).forEach((e, n) => sums[n] = (sums[n] || 0) + Math.abs(e.amount)));
  const names = Object.keys(sums).sort((a, b) => sums[b] - sums[a]);
  if (!state.trendItem || !names.includes(state.trendItem)) state.trendItem = names.find(n => USAGE_KINDS.includes(kindOf(n))) || names[0];
  const years = [...new Set(state.bills.map(b => b.yearMonth.slice(0, 4)))].sort().reverse();
  if (!state.statYear || !years.includes(state.statYear)) state.statYear = years[0];
  const yb = state.bills.filter(b => b.yearMonth.startsWith(state.statYear));
  const ysum = yb.reduce((s, b) => s + sumItems(b.items), 0);
  const ymax = yb.reduce((m, b) => !m || sumItems(b.items) > sumItems(m.items) ? b : m, null);
  const ymin = yb.reduce((m, b) => !m || sumItems(b.items) < sumItems(m.items) ? b : m, null);
  const prevYearBills = state.bills.filter(b => b.yearMonth.startsWith(String(+state.statYear - 1)));
  const hasYoY = prevYearBills.length > 0;

  view.innerHTML = `
  <div class="card"><div class="row between"><h2 style="margin:0">연간 요약</h2>
    <select class="f" id="yearSel" style="width:auto">${years.map(y => `<option ${y === state.statYear ? 'selected' : ''}>${y}</option>`).join('')}</select></div>
    <div class="grid g3 kpis" style="margin-top:12px">
      <div class="kpi" style="background:#F7F8FB;border-radius:10px"><div class="k">연간 합계 (${yb.length}개월)</div><div class="v num">${won(ysum)}</div></div>
      <div class="kpi" style="background:#F7F8FB;border-radius:10px"><div class="k">월평균</div><div class="v num">${won(ysum / (yb.length || 1))}</div></div>
      <div class="kpi" style="background:#F7F8FB;border-radius:10px"><div class="k">가장 많이 나온 달</div><div class="v num">${ymax ? `${monthOf(ymax.yearMonth)}월` : '-'}</div>
        <div class="d muted num">${ymax ? won(sumItems(ymax.items)) : ''}${ymin && ymin !== ymax ? ` · 최저 ${monthOf(ymin.yearMonth)}월` : ''}</div></div>
    </div></div>

  <div class="card"><h2>최근 12개월 총액 추이 <small>점선: 평균 ${won(avg)}</small></h2><div class="chartbox"><canvas id="cTotal"></canvas></div></div>

  <div class="card"><div class="row between"><h2 style="margin:0">항목별 추이</h2>
    <select class="f" id="itemSel" style="width:auto;max-width:60%">${names.map(n => `<option ${n === state.trendItem ? 'selected' : ''}>${esc(n)}</option>`).join('')}</select></div>
    <div class="chartbox" style="margin-top:10px"><canvas id="cItem"></canvas></div>
    <p class="muted small" style="margin:6px 0 0">막대: 금액, 선: 사용량(고지서에 있을 때)</p></div>

  <div class="card"><h2>작년 같은 달과 비교</h2>
    ${hasYoY ? `<div class="chartbox"><canvas id="cYoY"></canvas></div><div class="tscroll" style="margin-top:10px">${yoyTable()}</div>`
      : `<p class="muted">작년 데이터가 쌓이면 ${state.statYear}년과 ${+state.statYear - 1}년을 월별로 비교해 드려요.</p>`}</div>`;

  $('#yearSel').onchange = e => { state.statYear = e.target.value; renderTrends(); };
  $('#itemSel').onchange = e => { state.trendItem = e.target.value; renderTrends(); };

  chart('cTotal', { type: 'bar', data: { labels: months.map(ymShort), datasets: [
      { label: '총액', data: totals, backgroundColor: months.map((m, i) => i === months.length - 1 ? C.navy : C.slate), borderRadius: 6, order: 2 },
      { label: '평균', type: 'line', data: months.map(() => avg), borderColor: C.navy2, borderDash: [5, 5], pointRadius: 0, borderWidth: 1.5, order: 1 }] },
    options: { maintainAspectRatio: false, plugins: { legend: { display: false }, tooltip: tooltipWon },
      scales: { y: { ticks: { callback: wonTick }, grid: { color: C.grid } }, x: { grid: { display: false } } } } });

  const s = itemSeries(state.trendItem, months);
  const unit = s.find(x => x.unit)?.unit || '';
  const hasUsage = s.some(x => x.usage != null);
  chart('cItem', { type: 'bar', data: { labels: months.map(ymShort), datasets: [
      { label: state.trendItem, data: s.map(x => x.amt), backgroundColor: C.navy2, borderRadius: 6, yAxisID: 'y', order: 2 },
      ...(hasUsage ? [{ label: `사용량${unit ? ' (' + unit + ')' : ''}`, type: 'line', data: s.map(x => x.usage), borderColor: C.amber, backgroundColor: C.amber, yAxisID: 'y1', tension: .3, spanGaps: true, order: 1 }] : [])] },
    options: { maintainAspectRatio: false, plugins: { legend: { display: hasUsage, position: 'bottom' }, tooltip: tooltipWon },
      scales: { y: { ticks: { callback: wonTick }, grid: { color: C.grid } }, x: { grid: { display: false } },
        ...(hasUsage ? { y1: { position: 'right', grid: { display: false }, title: { display: !!unit, text: unit } } } : {}) } } });

  if (hasYoY) {
    const y = +state.statYear, lbl = Array.from({ length: 12 }, (_, i) => `${i + 1}월`);
    const ser = yr => lbl.map((_, i) => { const b = billByYm(`${yr}-${String(i + 1).padStart(2, '0')}`); return b ? sumItems(b.items) : null; });
    chart('cYoY', { type: 'line', data: { labels: lbl, datasets: [
        { label: `${y}년`, data: ser(y), borderColor: C.navy, backgroundColor: C.navy, tension: .3, spanGaps: true },
        { label: `${y - 1}년`, data: ser(y - 1), borderColor: C.slate, backgroundColor: C.slate, borderDash: [4, 4], tension: .3, spanGaps: true }] },
      options: { maintainAspectRatio: false, plugins: { legend: { position: 'bottom' }, tooltip: tooltipWon },
        scales: { y: { ticks: { callback: wonTick }, grid: { color: C.grid } }, x: { grid: { display: false } } } } });
  }
}
function yoyTable() {
  const y = +state.statYear;
  const rows = [];
  for (let m = 1; m <= 12; m++) {
    const mm = String(m).padStart(2, '0'), a = billByYm(`${y}-${mm}`), b = billByYm(`${y - 1}-${mm}`);
    if (!a || !b) continue;
    const ta = sumItems(a.items), tb = sumItems(b.items), d = ta - tb;
    rows.push(`<tr><td>${m}월</td><td class="num">${won(tb)}</td><td class="num">${won(ta)}</td><td class="num ${dirCls(d)}">${arrow(d)} ${num(Math.abs(d))}</td><td class="num ${dirCls(d)}">${pctStr(d / tb * 100)}</td></tr>`);
  }
  return rows.length ? `<table class="t"><thead><tr><th>월</th><th>${y - 1}년</th><th>${y}년</th><th>증감(원)</th><th>증감률</th></tr></thead><tbody>${rows.join('')}</tbody></table>` : '<p class="muted small">같은 달 데이터가 아직 없어요.</p>';
}

/* --- 8-5. 기록 목록 · 상세 --- */

    <div id="recList" style="margin-top:6px">${list.map(b => {
      const p = billByYm(ymAdd(b.yearMonth, -1)), t = sumItems(b.items), d = p ? t - sumItems(p.items) : null;
      return `<a class="rec" href="#/record/${b.id}"><div class="ph" data-ph="${b.id}">${b.imageCount ? '' : '이미지<br>없음'}</div>
        <div class="m"><b>${ymLabel(b.yearMonth)}</b><span class="muted small">${b.items.length}개 항목${b.source === 'sample' ? ' · 샘플' : b.source === 'manual' ? ' · 직접 입력' : ''}${b.memo ? ' · ' + esc(b.memo) : ''}</span></div>
        <div class="amt"><b class="num">${won(t)}</b>${d != null ? `<div class="small num ${dirCls(d)}">${arrow(d)} ${num(Math.abs(d))}원</div>` : ''}</div></a>`;

    if (el && imgs[0]) el.innerHTML = `<img src="${imgs[0]}" alt="">`;
  }
}

async function renderRecordDetail(id) {
  const b = billByYm(id);
  if (!b) { view.innerHTML = `<div class="card empty"><p>기록을 찾을 수 없어요.</p><a class="btn" href="#/records">목록으로</a></div>`; return; }
  const imgs = await repo.getImages(id);
  const prev = billByYm(ymAdd(id, -1));
  const cmp = compare(b, prev);
  view.innerHTML = `
  <div class="card"><div class="row between"><div><a href="#/records" class="muted small" style="text-decoration:none">← 목록</a>
      <h2 style="margin:4px 0 0">${ymLabel(id)} 관리비</h2></div>
      <div class="row"><button class="btn ghost sm" id="btnEdit">수정</button><button class="btn danger sm" id="btnDel">삭제</button></div></div>
    <div style="font-size:28px;font-weight:800;margin:10px 0 2px" class="num">${won(cmp.total)}</div>
    ${b.billedTotal != null && b.billedTotal !== cmp.total ? `<div class="small muted">고지서 표기 합계 ${won(b.billedTotal)}</div>` : ''}
    ${b.memo ? `<p class="small">📝 ${esc(b.memo)}</p>` : ''}
    <p class="muted small" style="margin:4px 0 0">${b.source === 'ai' ? 'AI 분석' : b.source === 'sample' ? '샘플 데이터' : '직접 입력'} · 저장 ${new Date(b.updatedAt).toLocaleString('ko-KR')}</p>
  </div>
  <div class="grid g2">
    <div class="card"><h2>분석 결과 ${prev ? '<small>지난달 대비</small>' : ''}</h2><div class="tscroll">${compareTable(cmp, !!prev)}</div></div>
    <div class="card"><h2>원본 이미지</h2>${imgs.length ? `<div class="origimgs">${imgs.map(s => `<a href="${s}" target="_blank" rel="noopener"><img src="${s}" alt="고지서 원본"></a>`).join('')}</div>` : '<p class="muted">저장된 이미지가 없어요.</p>'}</div>
  </div>`;
  $('#btnDel').onclick = async () => {
    if (!confirm(`${ymLabel(id)} 기록과 원본 이미지를 삭제할까요? 되돌릴 수 없어요.`)) return;
    await repo.deleteBill(id); await reload(); toast('삭제했어요.'); location.hash = '#/records';
  };
  $('#btnEdit').onclick = () => {
    state.draft = { mode: 'edit', originalId: id, yearMonth: id, items: b.items.map(i => ({ ...i })), images: imgs, billedTotal: b.billedTotal, memo: b.memo, notes: '', source: b.source };
    renderEditorPage();
  };
}

/* --- 8-6. 설정 · 데이터 관리 --- */
function renderSettings() {
  const s = state.settings, h = s.household;

         <button class="btn ghost" id="uploadLocal">📤 이 기기에만 있던 기록을 서버로 올리기</button>`

/* ---------- 9. 내보내기 · 백업 · 샘플 ---------- */
function download(name, text, type) {
  const blob = new Blob([text], { type }); const a = document.createElement('a');
  a.href = URL.createObjectURL(blob); a.download = name; a.click(); setTimeout(() => URL.revokeObjectURL(a.href), 1000);
}
const csvCell = v => { const s = v == null ? '' : String(v); return /[",\n]/.test(s) ? `"${s.replace(/"/g, '""')}"` : s; };
function exportCsv(kind) {
  if (!state.bills.length) { toast('내보낼 데이터가 없어요.'); return; }
  let rows;
  if (kind === 'long') {
    rows = [['연월', '항목', '고지서표기', '금액(원)', '사용량', '단위', '월합계(원)', '메모']];
    for (const b of state.bills) for (const i of b.items) rows.push([b.yearMonth, i.name, i.rawLabel || '', i.amount, i.usage ?? '', i.unit || '', sumItems(b.items), b.memo || '']);
  } else {
    const names = [...new Set(state.bills.flatMap(b => b.items.map(i => i.name)))];
    rows = [['연월', ...names, '합계']];
    for (const b of state.bills) { const a = aggregate(b.items); rows.push([b.yearMonth, ...names.map(n => a.get(n)?.amount ?? ''), sumItems(b.items)]); }
  }
  // 엑셀에서 한글이 깨지지 않도록 UTF-8 BOM 추가
  download(`관리비_${kind === 'long' ? '항목별' : '월별'}_${nowYm()}.csv`, '﻿' + rows.map(r => r.map(csvCell).join(',')).join('\r\n'), 'text/csv;charset=utf-8');
}
async function exportJson() {
  const bills = await repo.listBills();
  const images = {}; for (const b of bills) images[b.id] = await repo.getImages(b.id);
  download(`관리비_백업_${new Date().toISOString().slice(0, 10)}.json`, JSON.stringify({ app: 'apt-bill', schemaVersion: 1, exportedAt: new Date().toISOString(), bills, images }), 'application/json');
}
async function importJson(file) {
  if (!file) return;
  try {
    const data = JSON.parse(await file.text());
    if (!Array.isArray(data.bills)) throw new Error('형식 오류');
    if (!confirm(`${data.bills.length}개월 기록을 복원할까요? 같은 달 기록은 백업 내용으로 덮어씁니다.`)) return;
    for (const b of data.bills) { if (!isYm(b.yearMonth)) continue; await repo.putBill({ ...b, id: b.yearMonth }); await repo.putImages(b.yearMonth, data.images?.[b.id] || []); }
    await reload(); toast('복원했어요.');
  } catch (e) { toast('백업 파일을 읽지 못했어요: ' + e.message); }
}

async function insertSample() {
  // 84㎡·4인·중앙난방 가정의 그럴듯한 가상 데이터 (최근 14개월)
  let seed = 7; const rnd = () => (seed = (seed * 16807) % 2147483647) / 2147483647;
  const end = ymAdd(nowYm(), -1);
  const months = Array.from({ length: 14 }, (_, i) => ymAdd(end, i - 13));
  const kwh = { 1: 330, 2: 310, 3: 290, 4: 270, 5: 280, 6: 320, 7: 430, 8: 470, 9: 350, 10: 290, 11: 300, 12: 330 };
  const water = { 1: 17, 2: 16, 3: 17, 4: 18, 5: 19, 6: 21, 7: 23, 8: 24, 9: 21, 10: 19, 11: 18, 12: 17 };
  const hot = { 1: 9.5, 2: 9, 3: 8, 4: 7, 5: 6, 6: 5, 7: 4.5, 8: 4.5, 9: 5, 10: 6.5, 11: 8, 12: 9.5 };
  const gcal = { 1: 1.75, 2: 1.5, 3: 0.95, 4: 0.35, 10: 0.3, 11: 0.95, 12: 1.6 };
  const elecFee = (k, summer) => { const [a, b] = summer ? [300, 450] : [200, 400]; let f = 910 + Math.min(k, a) * 120; if (k > a) f += (Math.min(k, b) - a) * 215 + 600; if (k > b) f += (k - b) * 307 + 5400; return Math.round(f * 1.137 / 10) * 10; };
  const existing = new Set(state.bills.map(b => b.yearMonth));
  for (const [idx, ym] of months.entries()) {
    if (existing.has(ym) && billByYm(ym).source !== 'sample') continue;
    const m = monthOf(ym), y = +ym.slice(0, 4), raise = y >= 2026 ? 1.04 : 1, isLast = idx === months.length - 1;
    const jit = (v, p = .03) => Math.round(v * (1 + (rnd() - .5) * 2 * p) / 10) * 10;
    const k = Math.round(kwh[m] * (0.95 + rnd() * .1)), w = Math.round(water[m] * (0.95 + rnd() * .1)), hw = +(hot[m] * (0.93 + rnd() * .14)).toFixed(1);
    const waterUnit = isLast ? 1350 : 1180; // 최근 달: 수도 단가 인상 시나리오
    const items = [
      { name: '일반관리비', amount: jit(52000 * raise, .01) }, { name: '청소비', amount: jit(18500 * raise, .01) },
      { name: '경비비', amount: jit(27000 * raise, .01) }, { name: '소독비', amount: 1200 },
      { name: '승강기유지비', amount: jit(m === 4 ? 9800 : 4800, .02) }, { name: '수선유지비', amount: jit(3500, .2) },
      { name: '장기수선충당금', amount: 21020 }, { name: '위탁관리수수료', amount: 1480 }, { name: '화재보험료', amount: 2110 },
      { name: '공동전기료', amount: jit(isSummer(m) ? 16500 : 11800, .06) }, { name: '공동수도료', amount: jit(2400, .1) },
      { name: '세대전기료', amount: elecFee(k, isSummer(m)), usage: k, unit: 'kWh' },
      { name: '세대수도료', amount: Math.round(w * waterUnit / 10) * 10, usage: w, unit: '㎥' },
      { name: '급탕비', amount: Math.round(hw * 7900 / 10) * 10, usage: hw, unit: '㎥' },
      { name: '가스료', amount: jit(isWinter(m) ? 13500 : 9800, .08), usage: isWinter(m) ? 14 : 10, unit: '㎥' },
      { name: 'TV수신료', amount: 2500 }, { name: '잡수입공제', amount: -jit(1800, .3) },
    ];
    if (gcal[m]) items.splice(13, 0, { name: '난방비', amount: Math.round(gcal[m] * (0.95 + rnd() * .1) * 98000 / 10) * 10, usage: gcal[m], unit: 'Gcal' });
    if (isLast) items.push({ name: '선거관리위원회운영비', amount: 600 });
    const now = new Date().toISOString();
    await repo.putBill({ id: ym, yearMonth: ym, items, total: sumItems(items), billedTotal: sumItems(items), memo: '', source: 'sample', imageCount: 0, createdAt: now, updatedAt: now, schemaVersion: 1 });
    await repo.putImages(ym, []);
  }
}

/* ---------- 10. 라우터 ---------- */
const NAV = [
  { h: '#/', ic: '📊', t: '대시보드' }, { h: '#/upload', ic: '➕', t: '등록' }, { h: '#/trends', ic: '📈', t: '추이' },
  { h: '#/records', ic: '🗂️', t: '기록' }, { h: '#/settings', ic: '⚙️', t: '설정' },
];
function setHeader() { const h = state.settings.household; $('#aptSub').textContent = `${h.aptName} · ${h.pyeong}평(${h.area}㎡) · ${h.members}인 · ${h.heating}`; }
function drawNav(cur) {
  const active = h => h === cur || (h === '#/records' && cur.startsWith('#/record'));
  $('#deskNav').innerHTML = NAV.map(n => `<a href="${n.h}" class="${active(n.h) ? 'active' : ''}">${n.t}</a>`).join('');
  $('#mobNav').innerHTML = NAV.map(n => `<a href="${n.h}" class="${active(n.h) ? 'active' : ''}"><span class="ic">${n.ic}</span>${n.t}</a>`).join('');
}
async function route() {
  const h = location.hash || '#/';
  destroyCharts(); drawNav(h); window.scrollTo(0, 0);
  if (state.draft?.mode === 'edit' && !h.startsWith('#/record/')) state.draft = null;
  try {
    if (h === '#/' || h === '#') renderDashboard();
    else if (h === '#/upload') renderUpload();
    else if (h === '#/trends') renderTrends();
    else if (h === '#/records') await renderRecords();
    else if (h.startsWith('#/record/')) await renderRecordDetail(decodeURIComponent(h.slice(9)));
    else if (h === '#/settings') renderSettings();
    else renderDashboard();
  } catch (e) { console.error(e); view.innerHTML = `<div class="card notice err">화면을 그리는 중 오류가 났어요: ${esc(e.message)}</div>`; }
}

(async function init() {
  $('#itemNames').innerHTML = STANDARD_ITEMS.map(n => `<option value="${n}">`).join('');
  window.addEventListener('unhandledrejection', e => toast(e.reason?.message || '오류가 났어요. 다시 시도해 주세요.', 6000));
  state.settings = await localRepo.getSettings();
  setHeader();
  pickRepo();
  try { await reload(); } catch (e) { state.bills = []; toast(e.message, 6000); }
  window.addEventListener('hashchange', route);
  route();
})();
</script>
