name = "apt-bill-proxy"
main = "worker.js"
compatibility_date = "2026-10-01"
keep_vars = true   # 대시보드에서 넣은 변수를 배포 때 지우지 않음

[vars]
ALLOWED_ORIGIN = "https://sunguphong.github.io"   # 앱 주소 (GitHub Pages, 도메인만)

# 관리비 기록 (월별 1행)
[[d1_databases]]
binding = "DB"
database_name = "apt-bill-db"
database_id = "5f6fea5a-6f4c-4655-aca7-289f7de69003"

# 고지서 원본 이미지 (키: img:YYYY-MM)
[[kv_namespaces]]
binding = "IMAGES"
id = "2e299182e7974a30a21bb6fc3910da51"

# 비밀값(대시보드 또는 wrangler secret put): ANTHROPIC_API_KEY, APP_PASSCODE
